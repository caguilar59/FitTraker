<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FitTraker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<header>
		<h1 class="text-center">FitTraker</h1>
	</header>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<!-- Dashboard stays on the left -->
			<a class="navbar-brand" href="index.html">Dashboard</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown"
				aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<!-- Links move to the right -->
			<div class="collapse navbar-collapse" id="navbarNavDropdown">
				<ul class="navbar-nav ms-auto">

					<li class="nav-item">
						<a class="nav-link active" aria-c    urrent="page" href="index.html">Home</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="views/program.html">Program</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">Add Exercise</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">Contact Us</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">Account</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="../welcome-page/contact.html">Support</a>
					</li>

				</ul>
			</div>
		</div>
	</nav>
	<main>
		<h2>Welcome</h2>
		<p>Track your workouts and stay active.</p>
		<div class="container my-4" id="calendar">
			<h2 class="text-center mb-4">Calendar</h2>

			<div class="calendar-container">
				<div class="calendar-row">
					<calendar-event
						v-for="(day, index) in calendarDays"
						:key="index"
						:current-date="day.currentDate"
						:block-info="day.blockInfo"
						:button-block="day.buttonBlock">
					</calendar-event>
				</div>
			</div>
		</div>


	</main>
	<footer>

	</footer>
    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

	<!-- Vue 2 -->
	<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

	<!-- Vue Component -->
	<script src="js/calendar.js"></script>

	<!-- Main Vue App -->
	<script src="js/scripts.js"></script>
</body>
</html>
