<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTraker | Account</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <header>
    <h1 class="text-center">FitTraker</h1>
  </header>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Dashboard</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="program.html">Program</a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              aria-disabled="true"
              href="excercise.html">
              Add Exercise
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active"
              aria-current="page"
              href="account.html">
              Account
            </a>
          </li>

          <li class="nav-item">
            <button
              class="nav-link"
              id="logoutButton"
              type="button">
              Log out
            </button>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="../../welcome-page/contact.html">
              Support
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 720px;">
    <h2 class="mb-4">My Account</h2>

    <p id="accountMessage" role="status" aria-live="polite"></p>

    <!-- Profile Details -->
    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h3 class="h5 mb-3">Profile details</h3>

        <form id="profileForm">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              class="form-control"
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required>
          </div>

          <button
            class="btn btn-primary"
            type="submit">
            Save changes
          </button>
        </form>
      </div>
    </section>

    <!-- Change Password -->
    <section class="card shadow-sm">
      <div class="card-body">
        <h3 class="h5 mb-3">Change password</h3>

        <form id="passwordForm">
          <div class="mb-3">
            <label for="currentPassword" class="form-label">
              Current password
            </label>
            <input
              class="form-control"
              id="currentPassword"
              name="currentPassword"
              type="password"
              autocomplete="current-password"
              required>
          </div>

          <div class="mb-3">
            <label for="newPassword" class="form-label">
              New password
            </label>
            <input
              class="form-control"
              id="newPassword"
              name="newPassword"
              type="password"
              autocomplete="new-password"
              minlength="12"
              required>
            <div class="form-text">Use at least 12 characters.</div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">
              Confirm new password
            </label>
            <input
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="12"
              required>
          </div>

          <button
            class="btn btn-primary"
            type="submit">
            Change password
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Bootstrap: enables the mobile navigation menu -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Session, logout, and account details -->
  <script src="../js/auth.js"></script>
  <script src="../js/account.js"></script>
</body>
</html>
