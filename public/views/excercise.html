<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitTraker | Exercise</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
	<header>
		<h1 class="text-center">FitTraker</h1>
	</header>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <!-- Brand -->
            <a class="navbar-brand" href="../index.html">
                Dashboard
            </a>

            <!-- Mobile Toggle -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div
                class="collapse navbar-collapse"
                id="navbarNavDropdown"
            >
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="program.html"

                        >
                            Program
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="excercise.html" aria-current="page">
                            Add Exercise
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="account.html">
                            Account
                        </a>
                    </li>

                    <li class="nav-item">
                        <button class="nav-link" id="logoutButton" type="button">Log out</button>
					</li>

                    <li class="nav-item">
                        <a class="nav-link" href="../../welcome-page/contact.html">
                            Support
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <main class="container my-4">
        <h2>Exercise Library</h2>
        <p>Add and manage your exercises.</p>

        <!-- Add Exercise Button -->
        <button class="btn btn-primary mb-3" id="addExerciseButton">
            <i class="bi bi-plus-lg"></i> Add Exercise
        </button>

        <!-- Exercise Form (hidden at first) -->
        <div id="exerciseFormContainer" class="card p-3 mb-4 d-none">
            <h4>Add a New Exercise</h4>

            <form id="exerciseForm">
                <div class="mb-3">
                    <label for="exerciseName" class="form-label">
                        Exercise Name
                    </label>
                    <input type="text" id="exerciseName"
                        class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="exerciseCategory" class="form-label">
                        Category
                    </label>
                    <select id="exerciseCategory"
                        class="form-select" required>
                        <option value="">Choose a category</option>
                        <option value="Strength">Strength</option>
                        <option value="Cardio">Cardio</option>
                        <option value="Flexibility">Flexibility</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="muscleGroup" class="form-label">
                        Muscles (separate with commas)
                    </label>
                    <input type="text" id="muscleGroup"
                        class="form-control"
                        placeholder="Chest, Triceps" required>
                </div>

                <div class="mb-3">
                    <label for="exerciseEquipment" class="form-label">
                        Equipment (separate with commas)
                    </label>
                    <input type="text" id="exerciseEquipment"
                        class="form-control"
                        placeholder="Barbell, Bench" required>
                </div>

                <div class="mb-3">
                    <label for="exerciseImage" class="form-label">
                        Image URL (optional)
                    </label>
                    <input type="url" id="exerciseImage"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="exerciseVideo" class="form-label">
                        Video URL (optional)
                    </label>
                    <input type="url" id="exerciseVideo"
                        class="form-control">
                </div>

                <button type="submit" class="btn btn-success">
                    Save Exercise
                </button>

                <button type="button" class="btn btn-secondary"
                    id="cancelExerciseButton">
                    Cancel
                </button>
            </form>
        </div>

        <!-- Exercise Cards Appear Here -->
        <h4 class="mb-3">My Exercises</h4>
        <div id="exerciseList" class="row g-3"></div>
    </main>



    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Your Program JavaScript -->
    <script src="../js/workout.js"></script>
    <script src="../js/exercise.js"></script>

</body>
</html>
